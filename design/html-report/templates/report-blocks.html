<!doctype html>
<html lang="en">

<title>HTML report</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f3;
  --paper: #ffffff;
  --paper-2: #f8f8f6;
  --ink: #171717;
  --muted: #6a6a65;
  --line: #dfdfda;
  --line-strong: #c4c4bd;
  --shadow: 0 1px 2px rgb(0 0 0 / 5%), 0 20px 60px rgb(0 0 0 / 6%);
  --success: #18794e;
  --success-bg: #eaf7f0;
  --warning: #8a5b00;
  --warning-bg: #fff6db;
  --danger: #b42318;
  --danger-bg: #fff0ee;
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 22px;
  --content: 1120px;
  --reading: 760px;
  --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111210;
    --paper: #191a18;
    --paper-2: #20211f;
    --ink: #f0f0ec;
    --muted: #a9aaa3;
    --line: #30312e;
    --line-strong: #454641;
    --shadow: 0 1px 2px rgb(0 0 0 / 35%), 0 24px 70px rgb(0 0 0 / 24%);
    --success: #72d6a5;
    --success-bg: #173428;
    --warning: #f1c66f;
    --warning-bg: #362b14;
    --danger: #ff9c94;
    --danger-bg: #3c211f;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--bg); }
body {
  margin: 0;
  min-width: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.58 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img, video, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration-color: var(--line-strong); text-underline-offset: .2em; }
a:hover { text-decoration-color: currentColor; }
button, input { font: inherit; }
.shell { width: min(100%, calc(var(--content) + 64px)); margin: 0 auto; padding: 0 32px 96px; }
.cover {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 40px;
  padding: clamp(72px, 12vw, 148px) 0 56px;
  border-bottom: 1px solid var(--line);
}
.eyebrow { margin: 0 0 18px; color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
h1 { max-width: 16ch; margin: 0; font-size: clamp(42px, 7vw, 82px); font-weight: 560; letter-spacing: -.055em; line-height: .98; text-wrap: balance; }
.deck { max-width: 62ch; margin: 28px 0 0; color: var(--muted); font-size: clamp(18px, 2.4vw, 25px); letter-spacing: -.018em; line-height: 1.36; text-wrap: pretty; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
.chip { display: inline-flex; min-height: 30px; align-items: center; padding: 4px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--paper); font-size: 13px; font-weight: 650; }
.cover-mark { align-self: start; width: 54px; height: 54px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--paper); color: var(--muted); font: 700 14px/1 var(--mono); }
.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: clamp(32px, 6vw, 84px); align-items: start; }
.toc { position: sticky; top: 24px; padding: 48px 0; }
.toc-label { margin: 0 0 15px; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc a { display: block; padding: 6px 0; color: var(--muted); font-size: 13px; line-height: 1.35; text-decoration: none; }
.toc a:hover { color: var(--ink); }
.document { min-width: 0; padding: 48px 0; }
.block { min-width: 0; scroll-margin-top: 24px; padding: 0 0 64px; margin: 0 0 64px; border-bottom: 1px solid var(--line); }
.block:last-child { margin-bottom: 0; border-bottom: 0; }
.block-head { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 14px; align-items: baseline; margin-bottom: 28px; }
.block-number { color: var(--muted); font: 650 11px/1 var(--mono); letter-spacing: .08em; }
h2 { margin: 0; font-size: clamp(28px, 4vw, 46px); font-weight: 560; letter-spacing: -.04em; line-height: 1.05; text-wrap: balance; }
h3 { margin: 0; font-size: 18px; line-height: 1.3; letter-spacing: -.018em; }
p { margin: 0 0 1em; }
p:last-child { margin-bottom: 0; }
.prose { max-width: var(--reading); font-size: 18px; }
.prose > :first-child { margin-top: 0; }
.prose > :last-child { margin-bottom: 0; }
.prose h3 { margin: 1.8em 0 .6em; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li + li { margin-top: .35em; }
.panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow); overflow: hidden; }
.callout { max-width: var(--reading); padding: 22px 24px; border-left: 4px solid var(--line-strong); border-radius: 0 var(--radius) var(--radius) 0; background: var(--paper); }
.callout[data-tone="success"] { border-left-color: var(--success); background: var(--success-bg); }
.callout[data-tone="warning"] { border-left-color: var(--warning); background: var(--warning-bg); }
.callout[data-tone="error"] { border-left-color: var(--danger); background: var(--danger-bg); }
.quote { max-width: var(--reading); margin: 0; padding-left: 28px; border-left: 2px solid var(--ink); }
.quote p { margin: 0; font-size: clamp(23px, 3.2vw, 36px); line-height: 1.24; letter-spacing: -.03em; text-wrap: balance; }
.quote footer { margin-top: 18px; color: var(--muted); font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 12px; }
.stat { min-width: 0; min-height: 152px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.stat-value { display: block; overflow-wrap: anywhere; font-size: clamp(31px, 4vw, 52px); font-weight: 570; letter-spacing: -.05em; line-height: 1; }
.stat-label { display: block; margin-top: 14px; font-weight: 700; }
.stat-detail { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; }
.table-wrap { max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
table { width: 100%; min-width: 600px; border-collapse: collapse; text-align: left; font-size: 14px; }
th, td { padding: 15px 17px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); background: var(--paper-2); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
tr:last-child td { border-bottom: 0; }
.comparison { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 14px; }
.comparison-card { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.comparison-card .label { color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
.comparison-card h3 { margin-top: 10px; }
.comparison-card p { margin-top: 10px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; }
.list-item { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
.list-item:last-child { border-bottom: 1px solid var(--line); }
.marker { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--muted); font: 700 11px/1 var(--mono); }
.list-title { font-weight: 700; }
.list-detail { margin-top: 4px; color: var(--muted); font-size: 14px; }
.timeline { position: relative; list-style: none; margin: 0; padding: 0 0 0 30px; }
.timeline::before { content: ""; position: absolute; top: 7px; bottom: 7px; left: 7px; width: 1px; background: var(--line-strong); }
.timeline li { position: relative; padding: 0 0 28px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; top: 7px; left: -27px; width: 9px; height: 9px; border: 3px solid var(--bg); border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 1px var(--line-strong); }
.timeline-time { color: var(--muted); font: 650 12px/1.4 var(--mono); }
.timeline h3 { margin-top: 6px; }
.timeline p { max-width: 64ch; margin-top: 7px; color: var(--muted); }
.code-shell { max-width: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: #151614; color: #f2f2ec; box-shadow: var(--shadow); }
.code-label { padding: 10px 16px; border-bottom: 1px solid #30312e; color: #9fa09a; font: 650 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
pre { max-width: 100%; margin: 0; padding: 20px; overflow: auto; font: 13px/1.58 var(--mono); tab-size: 2; }
code { font-family: var(--mono); }
.diagram { padding: clamp(16px, 3vw, 34px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); overflow-x: auto; }
.diagram svg { min-width: min(520px, 100%); height: auto; margin: 0 auto; color: var(--ink); }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; padding: 26px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.verdict-mark { min-width: 70px; padding: 8px 12px; border-radius: 999px; text-align: center; font: 750 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.verdict[data-status="pass"] .verdict-mark { color: var(--success); background: var(--success-bg); }
.verdict[data-status="partial"] .verdict-mark { color: var(--warning); background: var(--warning-bg); }
.verdict[data-status="fail"] .verdict-mark { color: var(--danger); background: var(--danger-bg); }
.verdict-lead { font-size: clamp(21px, 3vw, 31px); line-height: 1.25; letter-spacing: -.025em; }
.verdict-detail { margin-top: 10px; color: var(--muted); }
.flows { display: grid; gap: 12px; }
.flow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.flow h3 { overflow-wrap: anywhere; }
.flow p { margin-top: 5px; color: var(--muted); font-size: 14px; }
.status { padding: 6px 10px; border-radius: 999px; white-space: nowrap; font: 750 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.status[data-status="pass"] { color: var(--success); background: var(--success-bg); }
.status[data-status="partial"] { color: var(--warning); background: var(--warning-bg); }
.status[data-status="fail"] { color: var(--danger); background: var(--danger-bg); }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px; }
.gallery figure { min-width: 0; margin: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.gallery img { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: var(--paper-2); }
.gallery figcaption { padding: 13px 15px; color: var(--muted); font-size: 13px; }
.recording { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: #050505; }
.recording video { width: 100%; max-height: 72vh; }
.recording-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding: 14px 16px; background: var(--paper); }
.recording-label { font-weight: 700; }
.recording-links { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 13px; }
.gaps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 12px; }
.gap { padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.gap[data-severity="high"] { border-top: 3px solid var(--danger); }
.gap[data-severity="medium"] { border-top: 3px solid var(--warning); }
.gap h3 { overflow-wrap: anywhere; }
.gap p { margin-top: 8px; color: var(--muted); font-size: 14px; }
.sources { list-style: none; margin: 0; padding: 0; counter-reset: sources; }
.sources li { counter-increment: sources; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.sources li::before { content: counter(sources, decimal-leading-zero); color: var(--muted); font: 650 11px/1.7 var(--mono); }
.sources li:last-child { border-bottom: 1px solid var(--line); }
.sources a { overflow-wrap: anywhere; font-weight: 650; }
.source-note { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
.custom-report-block { max-width: 100%; }
.custom-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px; }
.custom-grid > * { min-width: 0; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.error-state { margin: 64px auto; padding: 24px; max-width: 720px; border: 1px solid var(--danger); border-radius: var(--radius); background: var(--danger-bg); color: var(--danger); white-space: pre-wrap; }
.footer { display: flex; justify-content: space-between; gap: 24px; padding-top: 32px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
@media (max-width: 760px) {
  .shell { padding: 0 20px 64px; }
  .cover { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-top: 68px; }
  .cover-mark { order: -1; width: 44px; height: 44px; }
  .layout { display: block; }
  .toc { position: static; padding: 26px 0; border-bottom: 1px solid var(--line); }
  .toc ol { columns: 2; column-gap: 20px; }
  .toc li { break-inside: avoid; }
  .document { padding-top: 42px; }
  .block { padding-bottom: 48px; margin-bottom: 48px; }
  .block-head { grid-template-columns: 26px minmax(0, 1fr); gap: 8px; }
  .verdict { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 430px) {
  .shell { padding-inline: 16px; }
  h1 { font-size: 42px; }
  .toc ol { columns: 1; }
  .flow { grid-template-columns: minmax(0, 1fr); }
  .status { justify-self: start; }
  .footer { display: block; }
  .footer span { display: block; margin-top: 5px; }
}
@media print {
  :root { color-scheme: light; --bg: #fff; --paper: #fff; --paper-2: #f7f7f5; --ink: #111; --muted: #555; --line: #d6d6d1; }
  body { font-size: 10pt; }
  .shell { width: 100%; max-width: none; padding: 0; }
  .cover { padding-top: 24mm; }
  .layout { display: block; }
  .toc { position: static; padding: 10mm 0; }
  .toc ol { columns: 3; }
  .document { padding-top: 10mm; }
  .block { break-inside: avoid; padding-bottom: 10mm; margin-bottom: 10mm; }
  .panel, .stat, .comparison-card, .callout, .diagram, .verdict, .flow, .gallery figure, .recording, .gap { box-shadow: none; }
  a { text-decoration: none; }
}
</style>

      "links": [
        {
          "label": "Open video",
          "url": "https://cdn.podist.ai/qa-artifacts/html/videos/onboarding-cover-upload-postfix-20260602-193905.mp4?v=20260603-v3"
        }
      ]
    },
    {
      "type": "gaps",
      "id": "gaps",
      "title": "Gaps",
      "items": [
        {
          "title": "Tablet not covered",
          "severity": "medium",
          "detail": "The report includes desktop and phone evidence only."
        },
        {
          "title": "Copy differs",
          "severity": "low",
          "detail": "Two surfaces use different labels for the same receipt."
        },
        {
          "title": "Recovery is blocked",
          "severity": "high",
          "detail": "The expired-session flow loses the pending cart."
        }
      ]
    },
    {
      "type": "sources",
      "id": "sources",
      "title": "Sources",
      "items": [
        {
          "label": "Report block reference",
          "url": "https://example.com/report-blocks",
          "note": "Block shapes and authoring rules"
        },
        {
          "label": "Decision source",
          "url": "https://example.com/decision",
          "note": "The evidence behind the report"
        }
      ]
    },
    {
      "type": "custom-html",
      "id": "custom-html",
      "title": "Custom HTML",
      "html": "\u003cdiv class=\"custom-grid\"\u003e\u003carticle\u003e\u003cstrong\u003eStandard first\u003c/strong\u003e\u003cp\u003eUse the existing block vocabulary for most report content.\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cstrong\u003eCustom when necessary\u003c/strong\u003e\u003cp\u003eCompose one unusual layout with semantic HTML and existing shell classes.\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cstrong\u003eStill disposable\u003c/strong\u003e\u003cp\u003eDo not turn a quick report into a frontend project.\u003c/p\u003e\u003c/article\u003e\u003c/div\u003e"
    }
  ]
}</script>
<script>
(() => {
  "use strict";
  const app = document.getElementById("app");
  const dataNode = document.getElementById("report-data");
  const text = (value) => value == null ? "" : String(value);
  const el = (tag, className, value) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (value !== undefined) node.textContent = text(value);
    return node;
  };
  const link = (label, url) => {
    const node = el("a", "", label);
    node.href = url;
    if (/^https?:/i.test(url)) { node.target = "_blank"; node.rel = "noreferrer"; }
    return node;
  };
  const detail = (item) => item.detail || item.description || item.note || "";

  function blockHeader(block, index) {
    const head = el("header", "block-head");
    head.append(el("span", "block-number", String(index + 1).padStart(2, "0")), el("h2", "", block.title));
    return head;
  }

  const renderers = {
    prose(block) {
      const node = el("div", "prose");
      node.innerHTML = block.html;
      return node;
    },
    callout(block) {
      const node = el("aside", "callout prose");
      node.dataset.tone = block.tone || "info";
      node.innerHTML = block.html;
      return node;
    },
    quote(block) {
      const node = el("blockquote", "quote");
      node.append(el("p", "", block.text));
      if (block.attribution) node.append(el("footer", "", block.attribution));
      return node;
    },
    stats(block) {
      const grid = el("div", "stats");
      for (const item of block.items) {
        const card = el("article", "stat");
        card.append(el("span", "stat-value", item.value), el("span", "stat-label", item.label));
        if (detail(item)) card.append(el("span", "stat-detail", detail(item)));
        grid.append(card);
      }
      return grid;
    },
    table(block) {
      const wrap = el("div", "table-wrap");
      const table = el("table");
      const thead = el("thead");
      const headRow = el("tr");
      for (const column of block.columns) headRow.append(el("th", "", typeof column === "string" ? column : column.label));
      thead.append(headRow);
      const tbody = el("tbody");
      for (const row of block.rows) {
        const tr = el("tr");
        const values = Array.isArray(row) ? row : block.columns.map((column) => row[typeof column === "string" ? column : column.key]);
        for (const value of values) tr.append(el("td", "", value));
        tbody.append(tr);
      }
      table.append(thead, tbody); wrap.append(table); return wrap;
    },
    comparison(block) {
      const grid = el("div", "comparison");
      for (const item of block.items) {
        const card = el("article", "comparison-card");
        card.append(el("span", "label", item.label || item.name || "Option"), el("h3", "", item.title || item.value));
        if (detail(item)) card.append(el("p", "", detail(item)));
        grid.append(card);
      }
      return grid;
    },
    checklist(block) {
      const list = el("ul", "list");
      for (const item of block.items) {
        const li = el("li", "list-item");
        li.append(el("span", "marker", item.done ? "✓" : "○"));
        const copy = el("div"); copy.append(el("div", "list-title", item.label || item.title));
        if (detail(item)) copy.append(el("div", "list-detail", detail(item)));
        li.append(copy); list.append(li);
      }
      return list;
    },
    timeline(block) {
      const list = el("ol", "timeline");
      for (const item of block.items) {
        const li = el("li"); li.append(el("div", "timeline-time", item.time || item.date || item.label), el("h3", "", item.title));
        if (detail(item)) li.append(el("p", "", detail(item)));
        list.append(li);
      }
      return list;
    },
    code(block) {
      const shell = el("div", "code-shell");
      shell.append(el("div", "code-label", block.language || "text"));
      const pre = el("pre"); pre.append(el("code", "", block.code)); shell.append(pre); return shell;
    },
    diagram(block) {
      const node = el("div", "diagram"); node.innerHTML = block.svg; return node;
    },
    verdict(block) {
      const node = el("article", "verdict"); node.dataset.status = block.status;
      node.append(el("span", "verdict-mark", block.status));
      const copy = el("div"); copy.append(el("div", "verdict-lead", block.lead));
      if (block.detail) copy.append(el("p", "verdict-detail", block.detail));
      node.append(copy); return node;
    },
    "flow-results"(block) {
      const list = el("div", "flows");
      for (const flow of block.flows) {
        const row = el("article", "flow");
        const copy = el("div"); copy.append(el("h3", "", flow.name || flow.title));
        if (detail(flow)) copy.append(el("p", "", detail(flow)));
        const status = el("span", "status", flow.status); status.dataset.status = flow.status;
        row.append(copy, status); list.append(row);
      }
      return list;
    },
    gallery(block) {
      const grid = el("div", "gallery");
      for (const item of block.items) {
        const figure = el("figure"); const image = el("img"); image.src = item.image; image.alt = item.alt; image.loading = "lazy";
        figure.append(image); if (item.caption) figure.append(el("figcaption", "", item.caption)); grid.append(figure);
      }
      return grid;
    },
    recording(block) {
      const card = el("article", "recording"); const video = el("video"); video.src = block.video; video.controls = true; video.preload = "metadata";
      if (block.poster) video.poster = block.poster; card.append(video);
      const meta = el("div", "recording-meta"); meta.append(el("span", "recording-label", block.label));
      if (Array.isArray(block.links) && block.links.length) {
        const links = el("div", "recording-links");
        for (const item of block.links) links.append(link(item.label, item.url));
        meta.append(links);
      }
      card.append(meta); return card;
    },
    gaps(block) {
      const grid = el("div", "gaps");
      for (const item of block.items) {
        const card = el("article", "gap"); card.dataset.severity = item.severity || "low";
        card.append(el("h3", "", item.title)); if (detail(item)) card.append(el("p", "", detail(item))); grid.append(card);
      }
      return grid;
    },
    sources(block) {
      const list = el("ol", "sources");
      for (const item of block.items) {
        const li = el("li"); const copy = el("div"); copy.append(link(item.label, item.url));
        if (item.note) copy.append(el("span", "source-note", item.note)); li.append(copy); list.append(li);
      }
      return list;
    },
    "custom-html"(block) {
      const node = el("div", "custom-report-block"); node.innerHTML = block.html; return node;
    },
  };

  try {
    const report = JSON.parse(dataNode.textContent);
    const doc = report.document;
    document.title = `${doc.title} — ${doc.type}`;
    const shell = el("main", "shell");
    const cover = el("header", "cover");
    const coverCopy = el("div");
    coverCopy.append(el("p", "eyebrow", doc.type), el("h1", "", doc.title), el("p", "deck", doc.summary));
    const meta = el("div", "meta");
    meta.append(el("span", "chip", doc.date));
    if (doc.status) meta.append(el("span", "chip", doc.status));
    for (const tag of doc.tags || []) meta.append(el("span", "chip", tag));
    coverCopy.append(meta); cover.append(coverCopy, el("div", "cover-mark", "HTML")); shell.append(cover);

    const layout = el("div", "layout");
    const nav = el("nav", "toc"); nav.setAttribute("aria-label", "Report sections"); nav.append(el("p", "toc-label", "Contents"));
    const navList = el("ol");
    const documentNode = el("article", "document");
    report.blocks.forEach((block, index) => {
      const item = el("li"); item.append(link(block.title, `#${block.id}`)); navList.append(item);
      const section = el("section", `block block-${block.type}`); section.id = block.id; section.append(blockHeader(block, index));
      const renderer = renderers[block.type];
      if (!renderer) throw new Error(`Unsupported block type: ${block.type}`);
      section.append(renderer(block)); documentNode.append(section);
    });
    nav.append(navList); layout.append(nav, documentNode); shell.append(layout);
    const footer = el("footer", "footer"); footer.append(el("strong", "", doc.title), el("span", "", doc.provenance || `Generated from structured report data · ${doc.date}`)); shell.append(footer);
    app.replaceChildren(shell);
  } catch (error) {
    const state = el("pre", "error-state", `This report could not be rendered.\n\n${error.message}`);
    app.replaceChildren(state);
  }
})();
</script>
</body>
</html>
